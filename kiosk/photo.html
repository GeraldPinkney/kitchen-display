<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kitchen Display Photos</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      cursor: none !important;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    .slide {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      background: #000;
      opacity: 0;
      transition: opacity 1200ms ease-in-out;
      pointer-events: none;
      user-select: none;
    }
    .slide.active {
      opacity: 1;
    }
  </style>
</head>
<body>
  <img id="layer-a" class="slide" alt="">
  <img id="layer-b" class="slide" alt="">
  <script>
    (() => {
      "use strict";

      const DEFAULT_RETURN_URL = "http://192.168.178.84/kitchen-display/home?kiosk";
      const MANIFEST_PATH = "photos/manifest.json";
      const STORAGE_KEY = "kd-photo-index";
      // 30 s per photo: with 300 photos that is a ~2.5 h cycle, so a photo returns
      // about once a day at the panel's idle rate (#17).
      const SLIDE_INTERVAL_MS = 30000;
      // Touch is the documented way out of the frame. The panel's compositor does
      // not report touch as activity to swayidle (observed 2026-11-18: idle fired
      // twice around a touch, no resume), so the page owns the exit itself.
      const LEAVE_GUARD_MS = 700;
      const armedAt = Date.now();
      let leaving = false;

      function leave() {
        if (leaving || Date.now() - armedAt < LEAVE_GUARD_MS) {
          return;
        }
        leaving = true;
        window.location.replace(getReturnUrl());
      }

      for (const type of ["pointerdown", "touchstart", "mousedown", "keydown"]) {
        document.addEventListener(type, leave, { capture: true, passive: true });
      }

      function getReturnUrl() {
        try {
          const raw = new URLSearchParams(window.location.search).get("return");
          if (raw) {
            const parsed = new URL(raw);
            if (parsed.protocol === "http:" || parsed.protocol === "https:") {
              return parsed.toString();
            }
          }
        } catch (_) {
          // Fall through to default dashboard URL.
        }
        return DEFAULT_RETURN_URL;
      }

      function fallbackToDashboard() {
        window.location.replace(getReturnUrl());
      }

      function readSavedIndex() {
        try {
          const raw = window.localStorage.getItem(STORAGE_KEY);
          if (raw !== null && /^\d+$/.test(raw)) {
            const parsed = Number.parseInt(raw, 10);
            if (Number.isSafeInteger(parsed) && parsed >= 0) {
              return parsed;
            }
          }
        } catch (_) {
          // Ignore storage access errors in private or restricted modes.
        }
        return 0;
      }

      function writeSavedIndex(value) {
        try {
          window.localStorage.setItem(STORAGE_KEY, String(value));
        } catch (_) {
          // Ignore storage access errors in private or restricted modes.
        }
      }

      function preload(src) {
        return new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => {
            if (typeof img.decode === "function") {
              img.decode().then(() => resolve(src), () => resolve(src));
            } else {
              resolve(src);
            }
          };
          img.onerror = () => reject(new Error("failed to load " + src));
          img.src = src;
        });
      }

      async function start() {
        let data;
        try {
          const resp = await fetch(MANIFEST_PATH, { cache: "no-store" });
          if (!resp.ok) {
            fallbackToDashboard();
            return;
          }
          data = await resp.json();
        } catch (_) {
          fallbackToDashboard();
          return;
        }

        if (!data || Number(data.count) === 0 || !Array.isArray(data.items) || data.items.length === 0) {
          fallbackToDashboard();
          return;
        }

        const items = data.items.filter(
          (item) => item && typeof item.name === "string" && item.name.length > 0
        );
        if (items.length === 0) {
          fallbackToDashboard();
          return;
        }

        const versionQuery =
          typeof data.generated_at === "string" && data.generated_at.length > 0
            ? "?v=" + encodeURIComponent(data.generated_at)
            : "";

        const layers = [
          document.getElementById("layer-a"),
          document.getElementById("layer-b"),
        ];
        let activeLayer = 1;
        let index = readSavedIndex() % items.length;

        async function advance() {
          for (let attempts = 0; attempts < items.length; attempts += 1) {
            const item = items[index];
            index = (index + 1) % items.length;
            const src = "photos/" + encodeURIComponent(item.name) + versionQuery;
            try {
              await preload(src);
              const nextLayer = 1 - activeLayer;
              layers[nextLayer].src = src;
              layers[nextLayer].classList.add("active");
              layers[activeLayer].classList.remove("active");
              activeLayer = nextLayer;
              writeSavedIndex(index);
              window.setTimeout(advance, SLIDE_INTERVAL_MS);
              return;
            } catch (_) {
              // Skip broken or missing photo and try the next item immediately.
            }
          }
          fallbackToDashboard();
        }

        advance();
      }

      start();
    })();
  </script>
</body>
</html>
